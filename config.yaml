# Job Finder App Configuration

# Target Search Keywords tailored for Fresh Graduates & Junior Developers
search_keywords:
  - "Software Engineer"
  - "Junior Software Engineer"
  - "Associate Software Engineer"
  - "Software Developer"
  - "Python Developer"
  - "Junior Full Stack Developer"
  - "Full Stack Developer"
  - "React Developer"
  - "Node.js Developer"
  - "Web Developer"
  - "Software Engineer Trainee"
  - "Graduate Software Engineer"
  - "Software Developer Intern"

# Target Locations (Karachi and Remote)
locations:
  - "Karachi, Pakistan"
  - "Remote"

# JobSpy Scraper Options
jobspy:
  sites:
    - "linkedin"
    - "indeed"
    - "google"
  results_wanted: 15
  hours_old: 72
  country_indeed: "Pakistan"

# Local Scrapers Configuration
local_scrapers:
  rozee_enabled: true

# Notification Provider (Discord)
notifications:
  discord_enabled: true
