[project]
name = "job-finder-app"
version = "2.1.0"
description = "Resume-aligned job discovery and Discord alerts for Faraz Hussain"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.14.7"
authors = [{ name = "Faraz Hussain" }]
dependencies = [
    "beautifulsoup4==4.15.0",
    "ddgs==9.15.0",
    "pandas>=3.0,<4",
    "python-jobspy==1.4.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[project.urls]
Repository = "https://github.com/asteroidcrib729/job-finder-app"

[project.scripts]
job-finder = "job_finder.application.pipeline:main"
job-finder-workflow = "job_finder.automation.runner:main"
job-finder-evaluate = "job_finder.evaluation.benchmark:main"
job-finder-feedback = "job_finder.evaluation.feedback:main"

[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "job_finder"
module-root = "src"
source-exclude = [".local/**"]

[tool.uv]
required-version = "==0.12.9"
cache-dir = ".local/cache/uv"

[dependency-groups]
dev = [
    "pyrefly==1.4.0",
    "ruff==0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
cache-dir = ".local/ruff-cache"
target-version = "py314"
src = ["src"]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["job_finder", "tests"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "."]
python-version = "3.14"
