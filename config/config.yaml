profile_path: profiles/candidate-profile.yaml

search_keywords:
  - "Junior Software Engineer"
  - "Next.js Developer"
  - "React Frontend Developer"
  - "TypeScript Full Stack Developer"
  - "Node.js Backend Developer"
  - "Python Django Developer"
  - "Python Flask Developer"
  - "Graduate Software Engineer"

search_tracks:
  - id: karachi_local
    location: "Karachi, Pakistan"
    remote: false
    country_indeed: Pakistan
    sites: [linkedin, indeed, google]
  - id: pakistan_remote
    location: Pakistan
    remote: true
    country_indeed: Pakistan
    sites: [linkedin, indeed]
  - id: global_remote
    location: ""
    remote: true
    country_indeed: USA
    sites: [linkedin, google]

jobspy:
  enabled: true
  sites: [linkedin, indeed, google]
  results_wanted: 25
  max_pages: 1
  max_queries: 56
  hours_old: 168
  query_timeout: 90
  max_seconds: 900
  # Listing discovery is separate from paced/cached description retrieval.
  linkedin_fetch_description: true
  linkedin_max_details: 36
  linkedin_detail_initial_requests: 16
  linkedin_detail_min_requests: 4
  linkedin_detail_max_delay: 10
  linkedin_queue_limit: 500
  linkedin_queue_retention_hours: 72
  linkedin_queue_max_attempts: 4
  employer_fallback_enabled: true
  linkedin_detail_timeout: 8
  linkedin_detail_delay: 2
  linkedin_detail_max_seconds: 180
  linkedin_detail_cache_hours: 6
  linkedin_detail_retry_hours: 3
  # Upstream Google Jobs adapter is unavailable; one daily recovery probe only.
  google_mode: probe
  # Opt-in alternative requires SERPAPI_API_KEY; no API calls by default.
  google_provider: jobspy
  google_api_max_queries: 2
  google_probe_interval_hours: 24
  interval_hours: 3
  low_yield_interval_hours: 12

local_scrapers:
  rozee_enabled: true
  keywords: [Junior Software Engineer, Next.js Developer, Python Developer, React Developer]
  max_queries: 4
  max_pages: 2
  interval_hours: 3
  detail_cache_hours: 6
  max_details: 12
  timeout: 12

linkedin_posts:
  enabled: true
  search_backends: [yahoo, brave, duckduckgo]
  max_search_attempts: 12
  retry_hours: 3
  interval_hours: 6
  detail_cache_hours: 6
  max_results: 6
  max_checks: 8
  timeout: 8
  queries:
    - 'site:linkedin.com/posts Karachi "React" hiring'
    - 'site:linkedin.com/posts Karachi "Python" hiring'
    - 'site:linkedin.com/posts Karachi "Next.js" hiring'
    - 'site:linkedin.com/posts Remote "junior" "Python" hiring'
    - 'site:linkedin.com/posts Remote "graduate" "React" hiring'
    - 'site:linkedin.com/posts Karachi "Node.js" "junior" hiring'

# Public-feed adapters use the same eligibility, freshness and delivery rules.
remote_feeds:
  remotive_enabled: true
  wwr_enabled: true
  interval_hours: 6
  max_jobs: 100

matching:
  max_age_hours: 168
  min_score: 60
  allow_hybrid: true
  allow_internships: true
  allow_contracts: true
  allow_one_year_stretch: true
  remote_salary_policy: prefer_usd
  preferred_neighborhoods: []

notifications:
  discord_enabled: true
  send_review: true
  review_digest: true
  max_per_run: 20
  max_attempts: 3
  max_retry_wait: 30

state:
  retention_days: 30
  pending_days: 7
