name: Automated Job Discovery & Phone Alert Pipeline

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape and evaluate without Discord messages or state writes"
        type: boolean
        default: false
      verification_sample:
        description: "Refresh searches and send at most 3 jobs; use labeled review candidates only if no qualified jobs exist"
        type: boolean
        default: false
      refresh_searches:
        description: "Refresh listing searches within configured budgets; feed/probe cooldowns still apply"
        type: boolean
        default: false

permissions:
  contents: write

# Every production state writer shares this group. Never cancel a sending run.
concurrency:
  group: job-finder-production
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current production branch after acquiring concurrency
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned Python
        run: uv python install
      - name: Install the locked runtime environment
        run: uv sync --locked --no-dev

      - name: Validate environment
        run: uv pip check
      - name: Validate Python syntax
        run: uv run --locked --no-dev python -m compileall -q src tests
      - name: Run offline regression suite
        run: uv run --locked --no-dev python -m unittest discover -s tests -v

      - name: Discover, qualify, and notify
        id: pipeline
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          JOB_FINDER_DRY_RUN: ${{ inputs.dry_run || false }}
          JOB_FINDER_VERIFICATION_SAMPLE: ${{ inputs.verification_sample || false }}
          JOB_FINDER_REFRESH_SEARCHES: ${{ inputs.refresh_searches || false }}
        run: uv run --locked --no-dev python -m job_finder.automation.runner

      # A degraded scrape or partial delivery must not discard valid acknowledgements.
      - name: Persist delivery and discovery state
        id: state
        if: always() && steps.pipeline.outputs.persist_state == 'true'
        env:
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_AUTHOR_NAME: Faraz Hussain
          GIT_AUTHOR_EMAIL: 132701966+asteroidcrib729@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: uv run --locked --no-dev python -m job_finder.storage.sync_state --branch "$PRODUCTION_BRANCH"

      - name: Retain recovery state after persistence failure
        if: always() && steps.state.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: job-state-recovery-${{ github.run_id }}
          path: |
            data/seen_jobs.json
            data/seen_jobs.json.bak
            data/discovery_state.json
            data/discovery_state.json.bak
          if-no-files-found: warn
          retention-days: 7

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-discovery-${{ github.run_id }}
          path: .local/output/latest/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Surface pipeline or state persistence failure
        if: always() && (steps.pipeline.outcome == 'failure' || steps.state.outcome == 'failure')
        run: uv run --locked --no-dev python -m job_finder.automation.failure
