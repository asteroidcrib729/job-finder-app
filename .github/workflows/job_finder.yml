name: Automated Job Discovery & Phone Alert Pipeline

on:
  schedule:
    # Runs every 3 hours at off-peak minute 17 to avoid GitHub queue delays
    - cron: '17 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔎 Run Job Finder Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: 💾 Commit and Push Updated Seen Jobs State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update seen_jobs.json state [skip ci]"
          file_pattern: "data/seen_jobs.json"
          commit_user_name: "Job Finder Bot"
          commit_user_email: "actions@github.com"
