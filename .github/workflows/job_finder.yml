name: Automated Job Discovery & Phone Alert Pipeline

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Every production state writer shares this group. Never cancel a sending run.
concurrency:
  group: job-finder-production
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current production branch after acquiring concurrency
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock

      - name: Validate environment and offline regression suite
        run: |
          python -m pip check
          python -m unittest discover -s tests -v

      - name: Discover, qualify, and notify
        id: pipeline
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      # A degraded scrape or partial delivery must not discard valid acknowledgements.
      - name: Persist delivery and discovery state
        id: state
        if: always() && steps.pipeline.outcome != 'skipped' && steps.pipeline.outcome != ''
        env:
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m storage.sync_state --branch "$PRODUCTION_BRANCH"

      - name: Retain recovery state after persistence failure
        if: always() && steps.state.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: job-state-recovery-${{ github.run_id }}
          path: |
            data/seen_jobs.json
            data/seen_jobs.json.bak
            data/discovery_state.json
            data/discovery_state.json.bak
          if-no-files-found: warn
          retention-days: 7

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-discovery-${{ github.run_id }}
          path: output/latest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Surface degraded discovery or state persistence failure
        if: always() && (steps.pipeline.outcome == 'failure' || steps.state.outcome == 'failure')
        run: exit 1
