name: Verify Discord destination (read only)

on:
  workflow_dispatch:
    inputs:
      expected_server_id:
        description: "Server ID to compare with the configured webhook"
        required: true
        type: string
      message_id:
        description: "Previously acknowledged Discord message ID to look up"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.9'
      - run: uv python install
      - name: Read destination and existing message without sending
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXPECTED_SERVER_ID: ${{ inputs.expected_server_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: uv run --no-project python src/job_finder/discord_diagnostic.py
