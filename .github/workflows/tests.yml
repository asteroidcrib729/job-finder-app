name: Offline regression checks

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'development-plans/**'
      - '*.md'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --locked
      - run: uv pip check
      - run: uv run --locked ruff check src tests
      - run: uv run --locked pyrefly check
      - run: uv run --locked python -m compileall -q src tests
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build --no-cache --out-dir .local/dist
