name: Offline regression checks

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'development-plans/**'
      - '*.md'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --locked
      - run: uv pip check
      - run: uv run --locked ruff check src tests
      - run: uv run --locked pyrefly check
      - run: uv run --locked python -m compileall -q src tests
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
